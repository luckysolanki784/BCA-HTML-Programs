<html>
<head>
<title>Java Script</title>
</head>
<body>

<script>
var a = prompt("Enter value of a");
var b = prompt("Enter value of b");
var result;

a = parseInt(a);
b = parseInt(b);

document.write("a + b = ");
result = a + b;
document.write(result);
document.write("<br>");

document.write("a - b = ");
result = a - b;
document.write(result);
</script>

</body>
</html>
