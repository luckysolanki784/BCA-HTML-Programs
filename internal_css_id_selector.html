
<html>
<head>
    <title>Internal CSS Id Selector</title>
    <style>
        #Para1 {
            text-align: center;
            color: red;
        }
        #Para2 {
            color: pink;
            text-align: right;
        }
        #HT1 {
            text-align: center;
            color: orange;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <p id="Para1">Hello I am using Id Para 1</p>

    <h1 id="HT1">Styles using Id HT1</h1>

    <p id="Para2">I am getting style from Para2</p>

</body>
</html>
