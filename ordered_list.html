
<html>
<head>
    <title>LIST AND ITS ATTRIBUTES</title>
</head>
<body>
    <h2>ORDERED LIST</h2>

    <h2>DEFAULT TYPE</h2>
    <ol>
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
    </ol>

    <h3>LETTER TYPE</h3>
    <ol type="A">
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
    </ol>

    <ol type="a">
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
    </ol>

    <h4>ROMAN TYPE</h4>
    <ol type="I">
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
    </ol>

    <ol type="i">
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
    </ol>
</body>
</html>
