
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>
    <style>
        table {
            border-collapse: separate;
            border-spacing: 40px; 
            border: 2px solid black;
        }
        th, td {
            border: 1px solid black;
            padding: 10px; 
            text-align: center;
        }
        caption {
            font-weight: bold;
            font-size: 20px;
            caption-side: top;
        }
        img {
            width: 60px;
            height: 40px;
        }
    </style>
</head>
<body>
    <table>
        <caption>Restaurant menu</caption>
        <tr>
            <th>S.No</th>
            <th>Name of Item</th>
            <th>Rate</th>
            <th>Image</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Dosa</td>
            <td>120</td>
            <td><img src="dosa.jpg" alt="Dosa"></td>
        </tr>
        <tr>
            <td>2</td>
            <td>Pizza</td>
            <td>180</td>
            <td><img src="pizza.jpg" alt="Pizza"></td>
        </tr>
        <tr>
            <td>3</td>
            <td>Chowmin</td>
            <td>130</td>
            <td><img src="chowmin.jpg" alt="Chowmin"></td>
        </tr>
    </table>
</body>
</html>
