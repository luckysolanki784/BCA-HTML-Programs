
<html>
<head>
    <title>BCA Adm. Form</title>
</head>
<body>

<form>
<fieldset>
    <legend align="center"><h1>BCA Adm. Form</h1></legend>

    Name : <input type="text" maxlength="40"><br><br>
    FName : <input type="text" maxlength="25"><br><br>
    MName : <input type="text" maxlength="25"><br><br>
    DOB : <input type="date"><br><br>
    Address : <textarea rows="4" cols="30"></textarea><br><br>
    Pincode : <input type="number"><br><br>
    E-mail : <input type="email"><br><br>

    Gender :
    <input type="radio" name="A"> Male
    <input type="radio" name="A"> Female
    <br><br>

    <h1>Qualification</h1>
    Secondary <input type="checkbox"> 10th <br>
    Sr. Sec <input type="checkbox"> 12th <br>
    BCA <input type="checkbox"> BCA <br>
    Other <input type="checkbox"> Other <br><br>

    <h1>City</h1>
    <select id="City">
        <option value="Jodhpur">Jodhpur</option>
        <option value="Pali">Pali</option>
        <option value="Ajmer">Ajmer</option>
    </select>
    <hr>

    User : <input type="password"><br><br>
    <input type="reset" value="Reset"><br><br>
    <input type="submit" value="Submit">

</fieldset>
</form>

</body>
</html>
