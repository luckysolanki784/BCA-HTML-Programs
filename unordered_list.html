<html>
<head>
    <title>LIST AND ITS ATTRIBUTE</title>
</head>
<body>
    <h2>UNORDERED LIST</h2>
    
    <h2>CIRCLE SYMBOL</h2>
    <ul type="circle">
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
        <li>GOLD</li>
    </ul>

    <h3>SQUARE SYMBOL</h3>
    <ul type="square">
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
        <li>GOLD</li>
    </ul>

    <h4>NONE SYMBOL</h4>
    <ul type="none">
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
        <li>GOLD</li>
    </ul>

    <h5>DEFAULT SYMBOL</h5>
    <ul>
        <li>IRON</li>
        <li>BRONZE</li>
        <li>SILVER</li>
        <li>GOLD</li>
    </ul>
</body>
</html>
